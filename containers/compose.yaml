services:
  slopbox:
    image: ghcr.io/andypenno/slopbox:${SLOPBOX_VERSION:?Set SLOPBOX_VERSION to a published X.Y.Z release or X.Y.Z-alpine}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL to the public HTTPS address}
    volumes:
      - slopbox-data:/data

volumes:
  slopbox-data:
