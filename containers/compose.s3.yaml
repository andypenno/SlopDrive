name: slopdrive

services:
  slopdrive:
    image: ghcr.io/andypenno/slopdrive:${SLOPDRIVE_VERSION:?Set SLOPDRIVE_VERSION to an image with S3 support}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL to the public HTTPS address}
      DATABASE_PROVIDER: postgres
      DATABASE_HOST: postgres
      DATABASE_NAME: slopdrive
      DATABASE_USER: slopdrive
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      DATABASE_TLS_MODE: disable
      CONTENT_STORAGE: s3
      S3_ENDPOINT: ${S3_ENDPOINT:?Set the Garage or other S3-compatible endpoint}
      S3_BUCKET: ${S3_BUCKET:?Set the existing private bucket}
      S3_REGION: ${S3_REGION:?Set the endpoint signing region}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set the bucket access key}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set the bucket secret key}
      S3_PREFIX: ${S3_PREFIX:-slopdrive}
      S3_PATH_STYLE: "true"
      S3_ALLOW_HTTP: ${S3_ALLOW_HTTP:-false}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slopdrive
      POSTGRES_USER: slopdrive
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slopdrive -d slopdrive"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
