services:
  slopbox:
    image: ghcr.io/andypenno/slopbox:${SLOPBOX_VERSION:?Set SLOPBOX_VERSION to a published release}
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BASE_URL: ${BASE_URL:?Set BASE_URL to the public HTTPS address}
      DATABASE_PROVIDER: postgres
      DATABASE_HOST: postgres
      DATABASE_NAME: slopbox
      DATABASE_USER: slopbox
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD to a strong database password}
      DATABASE_TLS_MODE: disable
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slopbox
      POSTGRES_USER: slopbox
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD to a strong database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slopbox -d slopbox"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
