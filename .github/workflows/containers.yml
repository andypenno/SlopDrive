name: Shared container workflow

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            file: containers/Containerfile
          - variant: alpine
            file: containers/Containerfile.alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Package version
        id: package
        run: echo "version=$(python3 release/images.py version)" >> "$GITHUB_OUTPUT"
      - name: Export image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          tags: slopdrive:ci
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.variant }}.tar
          labels: |
            org.opencontainers.image.source=https://github.com/andypenno/SlopDrive
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          provenance: mode=max
          sbom: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.variant }}
          path: ${{ runner.temp }}/${{ matrix.variant }}.tar
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  test:
    name: Test (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo podman
      - name: Load tested image
        env:
          ENGINE: ${{ matrix.engine }}
          ARCHIVES: ${{ runner.temp }}/images
        run: |
          for variant in standard alpine; do
            if [ "$ENGINE" = docker ]; then
              skopeo copy --override-os linux --override-arch amd64 "oci-archive:$ARCHIVES/$variant.tar" "docker-daemon:slopdrive:$variant"
            else
              # Hosted Ubuntu restricts unprivileged user namespaces.
              sudo skopeo copy --override-os linux --override-arch amd64 "oci-archive:$ARCHIVES/$variant.tar" "containers-storage:slopdrive:$variant"
            fi
          done
      - name: Service and persistence checks
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          if [ "$ENGINE" = podman ]; then
            sudo python3 tests/container_smoke.py --engine podman --image slopdrive:standard --other-image slopdrive:alpine
            sudo python3 tests/container_smoke.py --engine podman --image slopdrive:alpine
          else
            python3 tests/container_smoke.py --engine docker --image slopdrive:standard --other-image slopdrive:alpine
            python3 tests/container_smoke.py --engine docker --image slopdrive:alpine
          fi
      - name: Compose configuration
        run: python3 tests/compose.py docker compose

  performance:
    name: Performance budgets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Install image tools
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes skopeo
          fi
      - name: Measure exact image artifacts
        env:
          ARCHIVES: ${{ runner.temp }}/images
          REVISION: ${{ github.sha }}
        run: |
          result=0
          for variant in standard alpine; do
            skopeo copy --override-os linux --override-arch amd64 "oci-archive:$ARCHIVES/$variant.tar" "docker-daemon:slopdrive:$variant"
            if ! python3 tests/performance/benchmark.py --engine docker --image "slopdrive:$variant" --archive "$ARCHIVES/$variant.tar" --variant "$variant" --profile ci --revision "$REVISION" --policy tests/performance/policy.json --output "test-output/performance-$variant.json"; then
              result=1
            fi
          done
          exit "$result"
      - name: Preserve raw measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-measurements
          path: test-output/performance-*.json
          retention-days: 7
          if-no-files-found: error
