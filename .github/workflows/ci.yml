name: CI and container release

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: S3 storage contracts
        run: SLOPBOX_TEST_CONTENT=s3 cargo test --locked --bin slopbox
      - name: Running service storage checks
        run: |
          cargo build --locked
          python3 tests/replicas.py --binary target/debug/slopbox
          python3 tests/content_tls.py --binary target/debug/slopbox
      - name: Homepage clipboard checks
        run: node tests/homepage.cjs
      - name: Release policy checks
        run: python3 tests/releases.py
      - name: Performance measurement checks
        run: |
          python3 tests/performance.py
          python3 tests/benchmark.py

  containers:
    name: Container checks
    needs: verify
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: none

  publish:
    name: Publish tested images
    needs: containers
    if: github.event_name == 'push' && github.repository == 'andypenno/SlopBox' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable images and branch channels
        env:
          ARCHIVES: ${{ runner.temp }}/images
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          python3 containers/release.py publish --archives "$ARCHIVES" --branch "$BRANCH" --sha "$COMMIT"
