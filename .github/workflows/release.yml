name: Promote versioned release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Promote tested main commit
    if: github.repository == 'andypenno/SlopDrive'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote both variants without rebuilding
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          python3 release/images.py promote --tag "$RELEASE_TAG"
